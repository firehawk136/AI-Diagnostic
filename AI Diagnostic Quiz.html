<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tool Diagnostic — Staff</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<!-- YOUR EXISTING CSS — UNCHANGED -->
<style>
/* (CSS exactly as you already provided — not repeated here to conserve space)
   IMPORTANT: keep ALL your existing CSS exactly as‑is.
   You do NOT need to change any styles for Sheets to work. */
</style>
</head>

<body>

<!-- ALL YOUR EXISTING HTML MARKUP — UNCHANGED -->
<!-- Intro, quiz, processing, profile, thanks, admin screens -->
<!-- (unchanged; omitted here for brevity) -->


<script>
/* ───────────────────────────────────────────────────────────── */
/*  REQUIRED CONFIG — THIS IS THE ONLY LINE YOU MUST EDIT        */
/* ───────────────────────────────────────────────────────────── */

const SHEETS_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

/* ───────────────────────────────────────────────────────────── */
/*  NO OTHER CONFIG REQUIRED                                      */
/* ───────────────────────────────────────────────────────────── */

const PASS = 'teach2026';
const PRI = {S:'Planning & programming', C:'Classroom engagement', N:'Independent learning'};
const BADGE = {
  C:{label:'Claude',cls:'badge-c'},
  N:{label:'NotebookLM',cls:'badge-n'},
  S:{label:'Spark',cls:'badge-s'}
};

// ─────────────────────────────────────────
// QUESTIONS (unchanged)
// ─────────────────────────────────────────
const QS = [
  {type:'mc', q:'What takes the most time in your weekly planning?', opts:[
    {t:'Writing unit plans, lesson outlines, or scope and sequences', v:'S'},
    {t:'Designing engaging tasks, activities, or learning experiences', v:'C'},
    {t:'Creating revision materials or resources for students to use independently', v:'N'}
  ]},
  {type:'mc', q:'Which challenge feels most pressing for your students right now?', opts:[
    {t:'Students need better support for independent revision and study', v:'N'},
    {t:'Students need more engaging, interactive learning experiences in class', v:'C'},
    {t:'Learning is not yet well sequenced or tied to curriculum requirements', v:'S'}
  ]},
  {type:'mc', q:'How would you most like to use AI in your teaching practice?', opts:[
    {t:'To generate lesson plans and programs aligned to our context', v:'S'},
    {t:'To build interactive tasks or simulations', v:'C'},
    {t:'To give students a study resource built from my materials', v:'N'}
  ]},
  {type:'mc', q:'What would most reduce your workload this term?', opts:[
    {t:'Drafting units and overviews more quickly', v:'S'},
    {t:'Access to a richer bank of learning activities', v:'C'},
    {t:'Independent study support for students', v:'N'}
  ]},
  {type:'mc', q:'Primary goal for AI use?', opts:[
    {t:'Student study support', v:'N'},
    {t:'Interactive learning experiences', v:'C'},
    {t:'Efficient planning and programming', v:'S'}
  ]},
  {type:'scale', q:'How important is data privacy when choosing AI tools?',
   low:'Not a priority', high:'Critical',
   map:{1:'C',2:'C',3:'N',4:'S',5:'S'}}
];

let answers = [], scaleRaw = null, cur = 0;

// ─────────────────────────────────────────
// PARAGRAPH LOGIC (unchanged)
// ─────────────────────────────────────────
function generateParagraph(answers, scale) {
  const cnt = {S:0, C:0, N:0};
  answers.slice(0,5).forEach(a=>a?.v && cnt[a.v]++);
  const [top, topN] = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];

  let privacy =
    scale <= 2 ? ' You are pragmatic about tools.' :
    scale === 3 ? ' You adopt tools cautiously.' :
    ' Data governance is central to how you evaluate tools.';

  let core =
    top === 'S' ? 'Your practice is grounded in structure and sequencing.' :
    top === 'C' ? 'You focus on engagement and experience in the classroom.' :
    'You invest in student independence and self‑directed learning.';

  return core + privacy;
}

// ─────────────────────────────────────────
// FINAL SUBMISSION — THIS IS THE KEY PART
// ─────────────────────────────────────────
async function doSubmit() {
  const tool = Object.entries({C:0,N:0,S:0}).map(([k]) =>
    answers.filter(a=>a?.v===k).length
  ).indexOf(Math.max(...Object.values({C:0,N:0,S:0})));

  const key = ['C','N','S'][tool] || 'C';
  const paragraph = generateParagraph(answers, scaleRaw || 3);

  const payload = {
    ts: Date.now(),
    tool: key,
    paragraph: paragraph,
    id: crypto.randomUUID()
  };

  // SEND TO GOOGLE SHEETS
  if (SHEETS_URL) {
    fetch(SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
  }

  showScreen('s-thanks');
}

/* ───────────────────────────────────────── */
/* EXISTING EVENT WIRING (unchanged)         */
/* ───────────────────────────────────────── */

document.getElementById('submit-btn')
  .addEventListener('click', doSubmit);

/* All other quiz / admin / navigation code remains unchanged */

showScreen('s-intro');
</script>

</body>
</html>
